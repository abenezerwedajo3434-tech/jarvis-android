name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract JARVIS
        run: |
          mkdir jarvis
          unzip -q JARVIS_Proper_Android.zip -d jarvis

      - name: Find Android project
        run: |
          PROJECT=$(find jarvis -name gradlew -type f | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          DIR=$(dirname "$PROJECT")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
